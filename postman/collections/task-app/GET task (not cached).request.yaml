$kind: http-request
url: "{{base_url}}/api/tasks/1;"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      pm.test("cached is false", () => pm.expect(pm.response.json().cached).to.eql(false));
      pm.test("has deadline_status", () => {
          pm.expect(pm.response.json().deadline_status).to.be.oneOf(["overdue", "due_soon", "on_track"]);
      });
    language: text/javascript
order: 1000
